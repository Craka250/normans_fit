<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Recover access to your VYRON Fitness account."
    >

    <meta
        name="theme-color"
        content="#080A0A"
    >

    <title>Forgot Password | VYRON Fitness</title>

    <link
        rel="icon"
        href="../assets/images/vyron-icon.png"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >

    <!-- VYRON Styles -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">

    <div class="auth-shell">

        <!-- BRAND -->
        <a
            class="auth-brand"
            href="../index.html"
            aria-label="VYRON Fitness home"
        >
            <img
                src="../assets/images/vyron-logo.png"
                alt="VYRON Fitness"
            >
        </a>


        <!-- AUTH LAYOUT -->
        <main class="auth-layout auth-layout-single">

            <section class="auth-panel auth-panel-centered">

                <div class="auth-card auth-card-narrow">

                    <!-- ICON -->
                    <div
                        class="auth-icon"
                        aria-hidden="true"
                    >
                        <i class="fa-solid fa-key"></i>
                    </div>


                    <!-- HEADING -->
                    <div class="auth-card-heading">

                        <span class="auth-kicker">
                            ACCOUNT RECOVERY
                        </span>

                        <h2>
                            RESET YOUR
                            <span>ACCESS.</span>
                        </h2>

                        <p>
                            Enter your account email. For security,
                            the response does not reveal whether an
                            account exists.
                        </p>

                    </div>


                    <!-- MESSAGE -->
                    <div
                        class="auth-message"
                        id="authMessage"
                        role="alert"
                        aria-live="polite"
                    ></div>


                    <!-- FORM -->
                    <form
                        id="forgotForm"
                        class="auth-form"
                        novalidate
                    >

                        <div class="form-field">

                            <label for="email">
                                Email address
                            </label>

                            <div class="input-wrap">

                                <i
                                    class="fa-regular fa-envelope"
                                    aria-hidden="true"
                                ></i>

                                <input
                                    id="email"
                                    name="email"
                                    type="email"
                                    autocomplete="email"
                                    maxlength="120"
                                    inputmode="email"
                                    placeholder="you@example.com"
                                    required
                                >

                            </div>

                            <small
                                class="field-error"
                                data-error-for="email"
                                aria-live="polite"
                            ></small>

                        </div>


                        <button
                            type="submit"
                            class="auth-submit"
                        >
                            <span>
                                Continue
                            </span>

                            <i
                                class="fa-solid fa-arrow-right"
                                aria-hidden="true"
                            ></i>
                        </button>

                    </form>


                    <!-- LOGIN DIVIDER -->
                    <div class="auth-divider">
                        <span>
                            REMEMBERED IT?
                        </span>
                    </div>


                    <!-- LOGIN -->
                    <a
                        class="auth-secondary-action"
                        href="login.html"
                    >
                        Return to login

                        <i
                            class="fa-solid fa-arrow-right"
                            aria-hidden="true"
                        ></i>
                    </a>


                    <!-- BACK -->
                    <a
                        class="auth-back"
                        href="../index.html"
                    >
                        <i
                            class="fa-solid fa-arrow-left"
                            aria-hidden="true"
                        ></i>

                        Back to VYRON
                    </a>

                </div>

            </section>

        </main>

    </div>


    <!-- Scripts -->
    <script src="../js/theme.js"></script>
    <script src="auth.js"></script>

</body>

</html>
