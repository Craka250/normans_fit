<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Set a new secure password for your VYRON Fitness account."
    >

    <meta
        name="theme-color"
        content="#080A0A"
    >

    <title>Reset Password | VYRON Fitness</title>

    <link
        rel="icon"
        href="../assets/images/vyron-icon.png"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >

    <!-- VYRON Styles -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">

    <div class="auth-shell">

        <!-- BRAND -->
        <a
            class="auth-brand"
            href="../index.html"
            aria-label="VYRON Fitness home"
        >
            <img
                src="../assets/images/vyron-logo.png"
                alt="VYRON Fitness"
            >
        </a>


        <!-- AUTH LAYOUT -->
        <main class="auth-layout auth-layout-single">

            <section class="auth-panel auth-panel-centered">

                <div class="auth-card auth-card-narrow">

                    <!-- ICON -->
                    <div
                        class="auth-icon"
                        aria-hidden="true"
                    >
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>


                    <!-- HEADING -->
                    <div class="auth-card-heading">

                        <span class="auth-kicker">
                            NEW PASSWORD
                        </span>

                        <h2>
                            BUILD A
                            <span>STRONG KEY.</span>
                        </h2>

                        <p>
                            Create a new password that meets every
                            VYRON security requirement.
                        </p>

                    </div>


                    <!-- MESSAGE -->
                    <div
                        class="auth-message"
                        id="authMessage"
                        role="alert"
                        aria-live="polite"
                    ></div>


                    <!-- RESET FORM -->
                    <form
                        id="resetForm"
                        class="auth-form"
                        novalidate
                    >

                        <!-- RESET TOKEN -->
                        <input
                            type="hidden"
                            id="resetToken"
                            name="resetToken"
                        >


                        <!-- NEW PASSWORD -->
                        <div class="form-field">

                            <label for="password">
                                New password
                            </label>

                            <div class="input-wrap">

                                <i
                                    class="fa-solid fa-lock"
                                    aria-hidden="true"
                                ></i>

                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    autocomplete="new-password"
                                    minlength="8"
                                    maxlength="128"
                                    placeholder="Enter new password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-toggle-password="password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    <i
                                        class="fa-regular fa-eye"
                                        aria-hidden="true"
                                    ></i>
                                </button>

                            </div>

                            <small class="password-hint">
                                8+ characters with uppercase,
                                lowercase, number and special
                                character.
                            </small>

                            <small
                                class="field-error"
                                data-error-for="password"
                                aria-live="polite"
                            ></small>

                        </div>


                        <!-- CONFIRM PASSWORD -->
                        <div class="form-field">

                            <label for="confirmPassword">
                                Confirm new password
                            </label>

                            <div class="input-wrap">

                                <i
                                    class="fa-solid fa-lock"
                                    aria-hidden="true"
                                ></i>

                                <input
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    type="password"
                                    autocomplete="new-password"
                                    minlength="8"
                                    maxlength="128"
                                    placeholder="Confirm new password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-toggle-password="confirmPassword"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    <i
                                        class="fa-regular fa-eye"
                                        aria-hidden="true"
                                    ></i>
                                </button>

                            </div>

                            <small
                                class="field-error"
                                data-error-for="confirmPassword"
                                aria-live="polite"
                            ></small>

                        </div>


                        <!-- SUBMIT -->
                        <button
                            type="submit"
                            class="auth-submit"
                        >
                            <span>
                                Update Password
                            </span>

                            <i
                                class="fa-solid fa-check"
                                aria-hidden="true"
                            ></i>
                        </button>

                    </form>


                    <!-- BACK -->
                    <a
                        class="auth-back"
                        href="login.html"
                    >
                        <i
                            class="fa-solid fa-arrow-left"
                            aria-hidden="true"
                        ></i>

                        Return to login
                    </a>

                </div>

            </section>

        </main>

    </div>


    <!-- Scripts -->
    <script src="../js/theme.js"></script>
    <script src="auth.js"></script>

</body>

</html>
