<!-- =========================================================
     5. OPTIONAL — REGISTERED USERS STAT
     Add this only if you want to display the number of
     locally registered VYRON users.
     ========================================================= -->

<div class="stat-item reveal">
    <span class="stat-number">
        <span data-user-count-value>0</span>
    </span>

    <span class="stat-label">
        REGISTERED USERS
    </span>
</div>


<!-- =========================================================
     6. REGISTERED USER COUNTER
     Reads the VYRON local authentication storage.
     ========================================================= -->

<script>
document.addEventListener('DOMContentLoaded', () => {
    const counterElements = document.querySelectorAll(
        '[data-user-count-value]'
    );

    if (!counterElements.length) {
        return;
    }

    try {
        const storedUsers = localStorage.getItem('vyron_users_v1');
        const users = JSON.parse(storedUsers || '[]');

        const userCount = Array.isArray(users)
            ? users.length
            : 0;

        counterElements.forEach(element => {
            element.textContent = userCount.toLocaleString();
        });

    } catch (error) {
        console.warn(
            'VYRON: Unable to load registered user count.',
            error
        );

        counterElements.forEach(element => {
            element.textContent = '0';
        });
    }
});
</script>
