<!-- Optional registered-users stat -->
<div class="stat-item reveal">
  <span class="stat-number"><span data-user-count-value>0</span></span>
  <span class="stat-label">REGISTERED USERS</span>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{try{const u=JSON.parse(localStorage.getItem('vyron_users_v1')||'[]');document.querySelectorAll('[data-user-count-value]').forEach(e=>e.textContent=(Array.isArray(u)?u.length:0).toLocaleString())}catch{}});
</script>
